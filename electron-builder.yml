# electron-builder 打包配置（Windows NSIS 安装包，spec 见 docs/试用前自查报告.md §三）。
#
# 与 electron.vite.config.ts 的分工：那边产出 out/（main 双入口 index+daemon、
# preload、renderer），这边把 out/ + 生产依赖 node_modules + resources/ 组装成
# 安装包。全仓库没有 app.isPackaged 分支——路径解析靠两件事：
#   1. import.meta 相对定位（asar 内成立，daemon fork 的 daemon.mjs 与 main 同目录）；
#   2. main 起 daemon 时注入 KAMIBUDDY_RESOURCES_DIR（src/main/index.ts 的 daemonEnv）
#      指向下面的 extraResources 物理目录——daemon 侧所有 resources 消费方零改动，
#      docx-engine 也因此天然物理化（外部 python 进程读不了 asar）。
appId: com.jlc.kamibuddy
productName: 嘉立创Work
directories:
  output: release           # .gitignore 已含 release/
  buildResources: build     # 存放 build/icon.png（源图 1024×1024，electron-builder 自行转 .ico）
files:
  # 白名单语义：只收构建产物与清单。生产依赖 node_modules 由 builder 自动收包
  #（externalizeDepsPlugin 全量 external，pi/koffi 等必须原样走 node_modules）；
  # 仓库根的 开源项目/ docs/ .trae/ scripts/ 等一律不进 asar。
  - out/**
  - package.json
  # 体积裁剪 ①（2026-09-19 实测）：pi SDK 在自己的嵌套 node_modules 里内嵌了
  # @esbuild 的**全平台**二进制（win32 / darwin / linux 各 arch / android /
  # freebsd / netbsd / openbsd / sunos / aix / openharmony，外加 3 个 13MB 的
  # .wasm），实测约 370MB，几乎构成 app.asar 的全部体积。
  # 我们只出 win32-x64（见下面的 win.target.arch），esbuild 在 Windows x64 上
  # 只解析 @esbuild/win32-x64，其余平台是纯冗余；win32-ia32 / win32-arm64 同理。
  - "!**/@esbuild/{aix-*,android-*,darwin-*,freebsd-*,linux-*,netbsd-*,openbsd-*,openharmony-*,sunos-*,win32-ia32,win32-arm64}/**"
asar: true
# 体积裁剪 ②（2026-09-19 实测）：Electron 自带约 50 个语言包，占 48MB；
# 部门内部使用只需中英双语。Electron 找不到对应 .pak 时回退 en-US。
electronLanguages:
  - zh-CN
  - en-US
# .node 原生模块（koffi / clipboard / console-mode / canvas）靠 smartUnpack 自动解包；
# 若打包后 koffi 动态 import 报「不是有效的 Win32 应用」即解包没生效，显式加：
# asarUnpack:
#   - "**/*.node"
extraResources:
  # resources/ 整体物理化 → <安装>/resources/resources/。
  # KAMIBUDDY_RESOURCES_DIR 指向这里；bin/uv.exe（fetch:uv 拉取）一并随包，
  # main 把该目录前置进 daemon 的 PATH——docx-env 的「裸 uv」候选直接命中。
  #
  # **运行时不再随包**（2026-09-18 设计变更）：三个托管运行时改为纯按需联网下载
  #（用户在「设置 → 内置运行时」点安装才下），所以
  #   - `resources/runtimes/payload/**`（构建期 fetch:node / fetch:gitbash 的几百 MB
  #     载荷）必须**排除**，否则安装包又会臃肿回 ≈484 MB；
  #   - `resources/runtimes/.cache/**` 是构建期脚本的下载缓存（可能上百 MB），同样排除。
  # 保留的只有文字资产：README.md、`gitbash/CORRESPONDING-SOURCE.md`（GPLv2 §3 的义务载体，
  # 安装时由 gitbash 运行时的解包步骤拷进实例根）。
  - from: resources
    to: resources
    filter:
      - "**/*"
      - "!runtimes/payload/**"
      - "!runtimes/.cache/**"
win:
  # exe 文件名必须 ASCII：安装目录与快捷方式仍按 productName 显示中文，
  # 但 exe 本身与 `artifactName` 保持 ASCII（下载/网盘/杀软兼容）。
  executableName: JLCWork
  # icon 用 PNG 源图（1024×1024）：electron-builder 的 app-builder 会自行转成多尺寸 .ico。
  # 不直接放 .ico 是为了让图标只有一个真源（改图标只改这一张图）。
  icon: build/icon.png
  # 2026-09-19 重开：electron-builder 26 的 exe 资源改写已换掉 rcedit 这个原生工具
  # （app-builder-lib@26.15.3 的依赖里是纯 JS 的 resedit，app-builder-bin 已不在依赖表里），
  # 所以 2026-09-17 那条「本机企业 AV 拦 rcedit 写资源、必报 UNKNOWN、重试无效」的
  # 结论前提已消失。本次实测结论见 docs/试用前自查报告.md §三。
  signAndEditExecutable: true
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: true
  perMachine: false               # 用户级安装，免管理员（部门同事未必有管理员权限）
  allowToChangeInstallationDirectory: false
  deleteAppDataOnUninstall: false # 卸载不删 ~/.kamibuddy（配置/会话保留）
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: 嘉立创Work
  unicode: true                   # 26.x 默认已开，显式声明：中文 productName 的前提
artifactName: JLC-Work-Setup-${version}.${ext}   # 产物文件名刻意 ASCII（下载/网盘/杀软兼容），界面与快捷方式仍是中文
