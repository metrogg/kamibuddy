[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "html-to-docx"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "python-docx>=1.1,<2",
    "html-for-docx>=1.1,<2",
    "beautifulsoup4>=4.12,<5",
    "lxml>=5.2,<6",
    "httpx>=0.27,<1",
    "Pillow>=10.3,<11",
    "click>=8.1,<9",
]

[project.optional-dependencies]
dev = ["pytest>=8.2,<9"]

[project.scripts]
html-to-docx = "html_to_docx.__main__:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["html_to_docx*"]
